<!doctype html>
<html lang="en">
    <head>
        <script id="color-mode">
            // Keep key and mode resolution aligned with +layout.svelte; parity is tested there.
            {
                let mode;
                try {
                    mode = localStorage.getItem('wk-color-mode');
                } catch {
                    /* Storage may be unavailable. */
                }
                document.documentElement.dataset.bsTheme =
                    mode === 'dark' || mode === 'light' ? mode : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
        </script>
        <meta charset="utf-8" />
        <meta name="google-site-verification" content="PkKWAJWa7qL8hqqtyfS-vKrsN28FDv59Uuc4s5snqv8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=JetBrains+Mono:wght@400;600&display=swap"
            rel="stylesheet" />
        <link

            integrity="sha384-V4f0OfYdUplbh1+0ObFR+1En9r32Yp/jhE5YVVuoDXuJuxokZSgagEVJAlvTH1LW"
            crossorigin="anonymous" />
        <link

        <div>%sveltekit.body%</div>
    </body>
</html>
