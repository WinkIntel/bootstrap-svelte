name: Publish

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Release channel (must match version and source)
                type: choice
                required: true
                default: latest
                options: [latest, maintenance, next]
            dry-run:
                description: Rehearse without publishing to npm
                type: boolean
                required: true
                default: true

permissions:
    contents: read

# Serialize all release lines for this package, including channel updates.
concurrency:
    group: npm-publish-bootstrap-svelte
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    build:
        name: Build release artifact
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        outputs:
            version: ${{ steps.policy.outputs.version }}
            sha256: ${{ steps.pack.outputs.sha256 }}
            artifact-id: ${{ steps.upload.outputs.artifact-id }}
        env:
            RELEASE_CHANNEL: ${{ inputs.tag }}
        steps:
            - name: Checkout selected source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26
                  package-manager-cache: false
            - name: Check release policy before dependency installation
              id: policy
              run: node scripts/release-policy.mjs guard
            - name: Setup pinned pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  run_install: false
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Test release controls
              run: node --test scripts/tests/release-*.test.mjs
            - name: Lint
              run: pnpm lint
            - name: Type check
              run: pnpm check-types
            - name: Test
              run: pnpm test
            - name: Build and package lint
              run: pnpm build
            - name: Pack without rerunning lifecycle scripts
              id: pack
              env:
                  RELEASE_DIR: ${{ runner.temp }}/release-package
              run: node scripts/release-policy.mjs pack
            - name: Upload the single release tarball
              id: upload
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/release-package/release.tgz
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0

    rehearsal:
        name: Rehearse protected release
        if: ${{ inputs.dry-run }}
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: npm-publish
        permissions:
            contents: read
        steps:
            - &release-node
              name: Setup Node.js without package caching
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 26
                  package-manager-cache: false
            - &release-download
              name: Download this run's exact artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  artifact-ids: ${{ needs.build.outputs.artifact-id }}
                  path: artifact
                  merge-multiple: true
            - &release-execute
              name: Verify artifact and execute selected mode
              env:
                  RELEASE_MODE: ${{ inputs.dry-run && 'dry-run' || 'publish' }}
                  RELEASE_CHANNEL: ${{ inputs.tag }}
                  RELEASE_VERSION: ${{ needs.build.outputs.version }}
                  RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
                  NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/release-user.npmrc
                  NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/release-global.npmrc
              run: |
                  node --input-type=module <<'NODE'
                  import { createHash } from 'node:crypto';
                  import { readFileSync, readdirSync, lstatSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';

                  const env = process.env;
                  const fail = (message) => { throw new Error(message); };
                  const mode = env.RELEASE_MODE;
                  if (!['dry-run', 'publish'].includes(mode)) fail('Invalid release mode');
                  if (env.NODE_AUTH_TOKEN || env.NPM_TOKEN) fail('Token fallback is not permitted');
                  if (env.GITHUB_REPOSITORY !== 'WinkIntel/bootstrap-svelte') fail('Unexpected repository');
                  if (!/^[a-f0-9]{40}$/.test(env.GITHUB_SHA ?? '')) fail('Invalid source SHA');
                  if (!/^[a-f0-9]{64}$/.test(env.RELEASE_SHA256 ?? '')) fail('Invalid artifact digest');
                  const tarball = './artifact/release.tgz';
                  const files = readdirSync('artifact');
                  if (files.length !== 1 || files[0] !== 'release.tgz' || !lstatSync(tarball).isFile()) fail('Expected one regular tarball');
                  const digest = createHash('sha256').update(readFileSync(tarball)).digest('hex');
                  if (digest !== env.RELEASE_SHA256) fail('Artifact digest mismatch');
                  const entries = execFileSync('tar', ['-tzf', tarball], { encoding: 'utf8' }).trim().split('\n');
                  if (entries.filter((entry) => entry === 'package/package.json').length !== 1) fail('Expected one package manifest');
                  const pkg = JSON.parse(execFileSync('tar', ['-xOzf', tarball, 'package/package.json'], { encoding: 'utf8' }));
                  const name = '@winkintel/bootstrap-svelte';
                  if (pkg.name !== name || pkg.version !== env.RELEASE_VERSION) fail('Package identity mismatch');
                  if (pkg.publishConfig !== undefined) fail('Artifact cannot override publishing configuration');
                  const version = pkg.version;
                  const match = typeof version === 'string' && version.length <= 128 && /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.exec(version);
                  if (!match || match[4]?.split('.').some((part) => /^\d+$/.test(part) && part.length > 1 && part.startsWith('0'))) fail('Invalid release version');
                  const channel = env.RELEASE_CHANNEL;
                  const major = match[1];
                  const prerelease = Boolean(match[4]);
                  if (!((major === '2' && !prerelease && channel === 'latest') || (major === '1' && !prerelease && channel === 'maintenance') || (major === '2' && prerelease && channel === 'next'))) fail('Version/channel mismatch');
                  const branch = major === '1' ? 'codex/maintenance-1.x' : 'main';
                  if (env.GITHUB_REF !== `refs/heads/${branch}` && env.GITHUB_REF !== `refs/tags/v${version}`) fail('Unapproved source ref');
                  const npmVersion = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
                  if (!(npmVersion[0] > 11 || (npmVersion[0] === 11 && (npmVersion[1] > 5 || (npmVersion[1] === 5 && npmVersion[2] >= 1))))) fail('npm >= 11.5.1 is required');
                  const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, { redirect: 'error', signal: AbortSignal.timeout(15000) });
                  const published = response.status === 200;
                  if (published) {
                      const existing = await response.json();
                      if (existing.name !== name || existing.version !== version) fail('Unexpected registry metadata');
                      if (mode === 'publish') fail('Version is already published');
                  } else if (response.status !== 404) {
                      fail(`Registry lookup failed: HTTP ${response.status}`);
                  }
                  console.log(JSON.stringify({ mode, name, version, channel, sha: env.GITHUB_SHA, sha256: digest }));
                  if (mode === 'dry-run' && published) {
                      console.log('::warning title=Already published::Current-run artifact validation passed; published tarball equality was not checked. Skipping npm publish --dry-run. Live publishing this version will fail; select a new version before a live release.');
                  } else {
                      const args = ['publish', tarball, '--ignore-scripts', '--access=public', '--registry=https://registry.npmjs.org', `--tag=${channel}`];
                      if (mode === 'dry-run') args.push('--dry-run');
                      execFileSync('npm', args, { stdio: 'inherit' });
                  }
                  NODE

    publish:
        name: Publish approved tarball
        if: ${{ !inputs.dry-run }}
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        steps:
            - *release-node
            - *release-download
            - *release-execute
