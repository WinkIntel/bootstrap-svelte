name: Release App authentication check

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-app-auth-check-bootstrap-svelte
    cancel-in-progress: false

jobs:
    check:
        if: ${{ github.repository == 'WinkIntel/bootstrap-svelte' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        environment: npm-publish
        steps:
            - name: Checkout reviewed main with no stored credentials
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.workflow_sha }}
                  persist-credentials: false
            - name: Setup Node.js without package caching
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  package-manager-cache: false
            - name: Check expected App configuration without reading the private key
              env:
                  RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  RELEASE_APP_KEY_PRESENT: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
              run: node scripts/release-app-check.mjs preflight
            - name: Authenticate as the repository-scoped release App
              id: app
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: WinkIntel
                  repositories: bootstrap-svelte
                  permission-contents: write
                  permission-workflows: write
                  skip-token-revoke: false
            - name: Verify identity and repository access using GET requests only
              env:
                  RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  RELEASE_APP_INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
                  RELEASE_APP_SLUG: ${{ steps.app.outputs.app-slug }}
                  RELEASE_APP_CHECK_TOKEN: ${{ steps.app.outputs.token }}
              run: node scripts/release-app-check.mjs verify
