name: CI

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    push:
        branches: [main, codex/maintenance-1.x]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  package-manager-cache: false
            - name: Setup pinned pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  run_install: false
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Test release controls
              run: node --test scripts/tests/release-*.test.mjs
            - name: Test form package controls
              run: node --test scripts/tests/form-package.test.mjs
            - name: Lint
              run: pnpm lint
            - name: Type check
              run: pnpm check-types
            - name: Test
              run: pnpm test
            - name: Build
              run: pnpm build
            - name: Inspect npm package contents
              run: npm pack --dry-run
            - name: Test packed form consumers
              run: pnpm test:svelte-consumer
            - name: Test focused runtime regressions at exact Svelte minimum
              env:
                  SVELTE_MINIMUM: 5.29.0
              run: |
                  node -e "require('node:assert/strict').equal(require('./package.json').peerDependencies.svelte, '^' + process.env.SVELTE_MINIMUM)"
                  pnpm add --save-dev --save-exact "svelte@$SVELTE_MINIMUM" --ignore-scripts
                  node -e "const assert = require('node:assert/strict'); const plugin = require('node:module').createRequire(require('node:fs').realpathSync('node_modules/@sveltejs/vite-plugin-svelte/package.json')); for (const load of [require, plugin]) assert.equal(load('svelte/package.json').version, process.env.SVELTE_MINIMUM); console.log('Verified repository and Vite plugin Svelte ' + process.env.SVELTE_MINIMUM)"
                  pnpm exec vitest run src/lib/ButtonGroup src/lib/Form/tests/form-group-correctness.svelte.test.ts src/lib/Pagination --silent
