name: CI

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    push:
        branches: [main, codex/maintenance-1.x]
    pull_request:

permissions:
    contents: read

jobs:
    development:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  package-manager-cache: false
            - name: Setup pinned pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  run_install: false
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Test release controls
              run: node --test scripts/tests/release-*.test.mjs
            - name: Test Svelte support controls
              run: node --test scripts/tests/svelte-support.test.mjs
            - name: Lint
              run: pnpm lint
            - name: Type check
              run: pnpm check-types
            - name: Test with coverage
              run: pnpm test:coverage
            - name: Build
              run: pnpm build
            - name: Inspect npm package contents
              run: npm pack --dry-run

    svelte-minimum:
        name: Svelte exact minimum
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  package-manager-cache: false
            - name: Setup pinned pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  run_install: false
            - name: Install frozen development dependencies
              run: pnpm install --frozen-lockfile
            - name: Install and verify the exact peer minimum in this disposable checkout
              run: |
                  minimum=$(node scripts/svelte-minimum.mjs)
                  pnpm add --save-dev --save-exact "svelte@$minimum" --ignore-scripts
                  SVELTE_MINIMUM="$minimum" node -e "require('node:assert/strict').equal(require('svelte/package.json').version, process.env.SVELTE_MINIMUM)"
            - name: Type check at the minimum
              run: pnpm check-types
            - name: Test at the minimum
              run: pnpm test
            - name: Build at the minimum
              run: pnpm build
            - name: Test the packed consumer at the minimum
              run: pnpm test:svelte-consumer

    # Preserve the existing branch-protection context and fail it when either job fails or is skipped.
    build:
        needs: [development, svelte-minimum]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - name: Require both Svelte validations to succeed
              env:
                  DEVELOPMENT_RESULT: ${{ needs.development.result }}
                  MINIMUM_RESULT: ${{ needs.svelte-minimum.result }}
              run: |
                  test "$DEVELOPMENT_RESULT" = success
                  test "$MINIMUM_RESULT" = success
